name: Quality gates
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run pytest --cov=app --cov-report=xml
      - run: uv run python -m app.evaluation --local --mode all --output evaluation/ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: checks-python-${{ matrix.python }}
          path: |
            coverage.xml
            evaluation/ci-results.json
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8001:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/test_services.py -v
        env:
          ATLAS_TEST_DATABASE_URL: postgresql+psycopg://atlas:integration-only@127.0.0.1:5432/atlas_test
          ATLAS_TEST_CHROMA_HOST: 127.0.0.1
          ATLAS_TEST_CHROMA_PORT: "8001"
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: uv run python scripts/verify_deployment.py --keep --output evaluation/container-smoke.json
      - run: docker compose up -d --force-recreate --wait --wait-timeout 180
      - run: uv run python scripts/verify_deployment.py --resume evaluation/container-smoke.json
      - run: docker compose logs --no-color --tail 150
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-smoke
          path: evaluation/container-smoke.json
      - run: docker compose down
        if: always()
